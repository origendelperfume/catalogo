<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>El Origen del Perfume | Catálogo y Pedidos</title>
<style>
  :root { --bg:#0f1117; --card:#181b22; --card-2:#20242e; --gold:#d4af37; --gold-soft:rgba(212,175,55,0.14); --text:#f3f4f6; --muted:#9ca3af; --border:#2b303c; --green:#22c55e; --red:#ef4444; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); padding-bottom:98px; }
  header { background:linear-gradient(135deg,#161922 0%,#0d0f14 100%); border-bottom:1px solid var(--border); padding:16px 14px 12px; position:sticky; top:0; z-index:30; }
  .brand { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .brand h1 { margin:0; font-size:1.18rem; color:var(--gold); }
  .brand small { display:block; color:var(--muted); font-size:0.76rem; }
  .badge-zone { background:var(--gold-soft); color:var(--gold); border:1px solid rgba(212,175,55,0.35); padding:4px 9px; border-radius:999px; font-size:0.72rem; font-weight:600; }
  .search-wrap { margin-top:10px; }
  .search-wrap input { width:100%; background:var(--card-2); border:1px solid var(--border); color:var(--text); padding:10px 12px; border-radius:10px; font-size:0.95rem; outline:none; }
  .tabs { display:flex; gap:6px; overflow-x:auto; padding:10px 14px 4px; scrollbar-width:none; }
  .tabs::-webkit-scrollbar { display:none; }
  .tab { background:var(--card); border:1px solid var(--border); color:var(--muted); padding:7px 13px; border-radius:999px; font-size:0.82rem; font-weight:600; white-space:nowrap; cursor:pointer; }
  .tab.active { background:var(--gold); color:#111; border-color:var(--gold); }
  .price-banner { margin:8px 14px; padding:10px 12px; background:var(--card); border:1px solid var(--border); border-radius:12px; font-size:0.78rem; color:var(--muted); display:flex; flex-wrap:wrap; gap:8px; justify-content:space-between; }
  .price-banner strong { color:var(--text); }
  .sesena-highlight { color:#4ade80 !important; font-weight:700; }
  .list { padding:6px 14px; display:grid; gap:10px; }
  .item { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:12px; display:flex; flex-direction:column; gap:8px; }
  .item.soldout { opacity:0.58; }
  .ref-pill { background:var(--card-2); color:var(--gold); font-weight:700; font-size:0.78rem; padding:3px 8px; border-radius:7px; border:1px solid var(--border); }
  .item-title { font-weight:700; font-size:0.98rem; margin:2px 0; }
  .item-sub { font-size:0.78rem; color:var(--muted); }
  .frag-link { display:inline-flex; align-items:center; gap:4px; margin-top:6px; padding:4px 9px; border-radius:7px; background:rgba(59,130,246,0.14); border:1px solid rgba(59,130,246,0.35); color:#93c5fd; font-size:0.74rem; font-weight:600; text-decoration:none; }
  .tag-new { background:rgba(34,197,94,0.16); color:#4ade80; border:1px solid rgba(34,197,94,0.35); font-size:0.68rem; font-weight:700; padding:2px 7px; border-radius:999px; margin-left:6px; }
  .tag-out { background:rgba(239,68,68,0.16); color:#f87171; border:1px solid rgba(239,68,68,0.35); font-size:0.68rem; font-weight:700; padding:2px 7px; border-radius:999px; margin-left:6px; }
  .controls { display:grid; grid-template-columns:1fr 1fr auto; gap:6px; align-items:center; }
  select, .btn-add { height:38px; border-radius:9px; font-size:0.82rem; font-weight:600; }
  select { background:var(--card-2); color:var(--text); border:1px solid var(--border); padding:0 8px; outline:none; }
  .btn-add { background:var(--gold); color:#111; border:none; padding:0 14px; cursor:pointer; font-weight:700; }
  .btn-add:disabled { background:#374151; color:#9ca3af; cursor:not-allowed; }
  .cart-bar { position:fixed; bottom:0; left:0; right:0; background:#14171f; border-top:1px solid var(--gold); padding:12px 14px; z-index:40; display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .cart-bar-info strong { display:block; font-size:1rem; color:var(--gold); }
  .cart-bar-info span { font-size:0.78rem; color:var(--muted); display:block; }
  .btn-open-cart { background:var(--green); color:#052e16; border:none; border-radius:11px; padding:11px 16px; font-weight:800; font-size:0.9rem; cursor:pointer; white-space:nowrap; }
  .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.82); z-index:50; overflow-y:auto; padding:16px; }
  .modal.open { display:block; }
  .modal-box { background:var(--card); border:1px solid var(--border); border-radius:16px; max-width:520px; margin:10px auto 40px; padding:16px; }
  .modal-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .modal-head h2 { margin:0; font-size:1.1rem; color:var(--gold); }
  .close-btn { background:none; border:none; color:var(--muted); font-size:1.4rem; cursor:pointer; }
  .cart-line { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:9px 0; border-bottom:1px solid var(--border); font-size:0.86rem; }
  .qty-box { display:flex; align-items:center; gap:6px; }
  .qty-btn { width:26px; height:26px; border-radius:7px; border:1px solid var(--border); background:var(--card-2); color:var(--text); font-weight:700; cursor:pointer; }
  .field { margin-top:10px; }
  .field label { display:block; font-size:0.8rem; color:var(--muted); margin-bottom:4px; }
  .field input, .field select { width:100%; background:var(--card-2); border:1px solid var(--border); color:var(--text); padding:9px 10px; border-radius:9px; font-size:0.9rem; }
  .alert-box { margin-top:10px; padding:10px; border-radius:10px; font-size:0.82rem; line-height:1.35; }
  .alert-warn { background:rgba(245,158,11,0.14); border:1px solid rgba(245,158,11,0.4); color:#fcd34d; }
  .alert-err { background:rgba(239,68,68,0.14); border:1px solid rgba(239,68,68,0.4); color:#fca5a5; }
  .alert-ok { background:rgba(34,197,94,0.14); border:1px solid rgba(34,197,94,0.4); color:#86efac; }
  .btn-wa { width:100%; margin-top:14px; background:#25D366; color:#052e16; border:none; border-radius:12px; padding:13px; font-size:0.98rem; font-weight:800; cursor:pointer; }
  .btn-wa:disabled { background:#374151; color:#9ca3af; cursor:not-allowed; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div><h1>El Origen del Perfume</h1><small>Equivalencias de alta duración · Seseña y Envíos</small></div>
    <span class="badge-zone">📍 El Quiñón / Seseña</span>
  </div>
  <div class="search-wrap"><input type="search" id="searchInput" placeholder="Buscar nº ref, perfume o marca..."></div>
</header>
<div class="tabs" id="catTabs">
  <button class="tab active" data-cat="Todos">Todos</button>
  <button class="tab" data-cat="Novedades">✨ Novedades</button>
  <button class="tab" data-cat="Masculina">Masculina</button>
  <button class="tab" data-cat="Femenina">Femenina</button>
  <button class="tab" data-cat="Nicho">Nicho / Autor</button>
</div>
<div class="price-banner" id="priceBanner"></div>
<main class="list" id="productList"></main>
<div class="cart-bar">
  <div class="cart-bar-info"><strong id="barTotal">0,00 € (0 uds)</strong><span id="barSub">Envío gratis en Seseña desde 25,00 €</span></div>
  <button class="btn-open-cart" onclick="openCart()">Ver Pedido 🛒</button>
</div>
<div class="modal" id="cartModal">
  <div class="modal-box">
    <div class="modal-head"><h2>Tu Pedido</h2><button class="close-btn" onclick="closeCart()">✕</button></div>
    <div id="cartItems"></div>
    <div class="field"><label>Modalidad de entrega *</label><select id="deliveryMode" onchange="updateCartUI()"><option value="quinon">📍 Recogida y prueba en El Quiñón (Gratis)</option><option value="sesena">🚗 Reparto a domicilio en Seseña (Gratis ≥ 25€)</option><option value="nacional">📦 Envío Nacional por Correos / Mensajería</option></select></div>
    <div id="deliveryAlert"></div>
    <div class="field"><label>Tu Nombre *</label><input type="text" id="custName" placeholder="Ej: Laura García"></div>
    <div class="field" id="addressWrap" style="display:none;"><label>Dirección / Zona de entrega *</label><input type="text" id="custAddress" placeholder="Calle, portal, piso o localidad"></div>
    <div class="field"><label>Notas (opcional)</label><input type="text" id="custNotes" placeholder="Ej: Prefiero recoger por la tarde / Bizum"></div>
    <div style="margin-top:12px;display:flex;justify-content:space-between;font-size:1.05rem;font-weight:800;"><span>Total estimado:</span><span id="modalTotal" style="color:var(--gold);">0,00 €</span></div>
    <button class="btn-wa" id="btnSendWA" onclick="sendWhatsApp()">📲 Enviar Pedido por WhatsApp</button>
  </div>
</div>

    return "<div class=\"item " + (out ? "soldout" : "") + "\"><div><span class=\"ref-pill\">Ref. #" + p.num + "</span>" + (p.novedad ? "<span class=\"tag-new\">NOVEDAD</span>" : "") + (out ? "<span class=\"tag-out\">AGOTADO</span>" : "") + "<div class=\"item-title\">" + p.nombre + "</div><div class=\"item-sub\">Inspirado en " + p.marca + " · Línea " + p.cat + "</div><a class=\"frag-link\" href=\"" + getFragranticaUrl(p) + "\" target=\"_blank\" rel=\"noopener noreferrer\">🌸 Ver notas en Fragrantica ↗</a></div><div class=\"controls\"><select id=\"type_" + p.num + "\" onchange=\"updateItemBtn('" + p.num + "')\" " + (out ? "disabled" : "") + "><option value=\"bote_nuevo\">🧴 Frasco Nuevo</option><option value=\"relleno\">♻️ Recarga (Seseña)</option></select><select id=\"size_" + p.num + "\" onchange=\"updateItemBtn('" + p.num + "')\" " + (out ? "disabled" : "") + "><option value=\"30\">30 ml (" + getPrice(p, "bote_nuevo", "30") + "€)</option><option value=\"50\" selected>50 ml (" + p50 + "€)</option><option value=\"100\">100 ml (" + getPrice(p, "bote_nuevo", "100") + "€)</option></select><button class=\"btn-add\" id=\"btn_" + p.num + "\" onclick=\"addToCart('" + p.num + "')\" " + (out ? "disabled" : "") + ">" + (out ? "Agotado" : "+ " + p50 + "€") + "</button></div></div>";
  }).join("") : "<div class=\"item\" style=\"text-align:center;color:var(--muted);\">No se encontraron perfumes.</div>";
}
function updateItemBtn(num) {
  const p = (APP_DATA.perfumes || []).find(x => String(x.num) === String(num));
  if (!p) return;
  const tipo = document.getElementById("type_" + num).value, sizeSel = document.getElementById("size_" + num);
  ["30","50","100"].forEach((sz, i) => { sizeSel.options[i].text = sz + " ml (" + getPrice(p, tipo, sz) + "€)"; });
  document.getElementById("btn_" + num).textContent = "+ " + getPrice(p, tipo, sizeSel.value) + "€";
}
function addToCart(num) {
  const p = (APP_DATA.perfumes || []).find(x => String(x.num) === String(num));
  if (!p || p.agotado) return;
  const tipo = document.getElementById("type_" + num).value, size = document.getElementById("size_" + num).value, unitPrice = getPrice(p, tipo, size);
  const ex = cart.find(i => String(i.num) === String(num) && i.tipo === tipo && i.size === size);
  if (ex) ex.qty += 1; else cart.push({ num: p.num, nombre: p.nombre, tipo, size, unitPrice, qty: 1 });
  updateBar();
}
function updateBar() {
  const qty = cart.reduce((s, i) => s + i.qty, 0), sub = cart.reduce((s, i) => s + i.qty * i.unitPrice, 0), freeMin = Number(APP_DATA.envioGratisSesena || 25), diff = freeMin - sub;
  document.getElementById("barTotal").textContent = fmtEur(sub) + " (" + qty + " uds)";
  document.getElementById("barSub").textContent = sub <= 0 ? "Envío gratis en Seseña desde " + fmtEur(freeMin) : (diff > 0 ? "Seseña: envío gratis desde " + fmtEur(freeMin) + " (faltan " + fmtEur(diff) + ")" : "✓ Envío GRATIS en Seseña conseguido");
}
function openCart() { document.getElementById("cartModal").classList.add("open"); updateCartUI(); }
function closeCart() { document.getElementById("cartModal").classList.remove("open"); }
function changeQty(idx, d) { cart[idx].qty += d; if (cart[idx].qty <= 0) cart.splice(idx, 1); updateBar(); updateCartUI(); }
function updateCartUI() {
  const box = document.getElementById("cartItems"), mode = document.getElementById("deliveryMode").value;
  document.getElementById("addressWrap").style.display = mode === "quinon" ? "none" : "block";
  if (!cart.length) { box.innerHTML = "<p style=\"color:var(--muted);\">Tu cesta está vacía.</p>"; document.getElementById("deliveryAlert").innerHTML = ""; document.getElementById("modalTotal").textContent = "0,00 €"; document.getElementById("btnSendWA").disabled = true; return; }
  box.innerHTML = cart.map((it, idx) => "<div class=\"cart-line\"><div><strong>#" + it.num + " " + it.nombre + "</strong><br><span style=\"color:var(--muted);font-size:0.78rem;\">" + it.size + "ml · " + (it.tipo === "bote_nuevo" ? "Frasco Nuevo" : "Recarga") + " · " + it.unitPrice + "€/ud</span></div><div class=\"qty-box\"><button type=\"button\" class=\"qty-btn\" onclick=\"changeQty(" + idx + ",-1)\">-</button><span>" + it.qty + "</span><button type=\"button\" class=\"qty-btn\" onclick=\"changeQty(" + idx + ",1)\">+</button></div></div>").join("");
  const sub = cart.reduce((s, i) => s + i.qty * i.unitPrice, 0), freeMin = Number(APP_DATA.envioGratisSesena || 25), sesenaCost = Number(APP_DATA.costeEnvioSesena || 2.5), nacCost = Number(APP_DATA.costeEnvioNacional || 5.5);
  let ship = 0, alertHtml = "", blocked = false;
  if (mode === "quinon") alertHtml = "<div class=\"alert-box alert-ok\">📍 Recogida y prueba gratuita en El Quiñón (Seseña).</div>";
  else if (mode === "sesena") {
    if (sub >= freeMin) alertHtml = "<div class=\"alert-box alert-ok\">🚗 <strong>¡Envío gratis en Seseña!</strong> Tu pedido alcanza los " + fmtEur(freeMin) + ".</div>";
    else { ship = sesenaCost; alertHtml = "<div class=\"alert-box alert-warn\">🚗 En Seseña el envío es <strong>GRATIS desde " + fmtEur(freeMin) + "</strong>. Te faltan <strong>" + fmtEur(freeMin - sub) + "</strong> para envío gratis (ahora +" + fmtEur(sesenaCost) + ").</div>"; }
  } else if (mode === "nacional") {
    if (cart.some(i => i.tipo === "relleno")) { blocked = true; alertHtml = "<div class=\"alert-box alert-err\">⚠️ Las recargas solo están disponibles en Seseña. Cambia a Frasco Nuevo para envío nacional.</div>"; }
    else { ship = nacCost; alertHtml = "<div class=\"alert-box alert-warn\">📦 Envío Nacional (+" + fmtEur(nacCost) + ").</div>"; }
  }
  document.getElementById("deliveryAlert").innerHTML = alertHtml;
  document.getElementById("modalTotal").textContent = fmtEur(sub + ship);
  document.getElementById("btnSendWA").disabled = blocked;
}
function sendWhatsApp() {
  const name = (document.getElementById("custName").value || "").trim(), mode = document.getElementById("deliveryMode").value, addr = (document.getElementById("custAddress").value || "").trim(), notes = (document.getElementById("custNotes").value || "").trim();
  if (!name) { alert("Por favor, escribe tu nombre."); return; }
  if (mode !== "quinon" && !addr) { alert("Indica tu dirección o localidad de entrega."); return; }
  const sub = cart.reduce((s, i) => s + i.qty * i.unitPrice, 0), freeMin = Number(APP_DATA.envioGratisSesena || 25);
  let ship = 0;
  if (mode === "sesena" && sub < freeMin) ship = Number(APP_DATA.costeEnvioSesena || 2.5);
  if (mode === "nacional") ship = Number(APP_DATA.costeEnvioNacional || 5.5);
  const total = sub + ship;
  const lines = cart.map(i => "• Ref #" + i.num + " " + i.nombre + " (" + i.size + "ml · " + (i.tipo === "bote_nuevo" ? "Frasco" : "Recarga") + ") x" + i.qty + " = " + (i.qty * i.unitPrice).toFixed(2) + "€").join("\n");
  const payloadObj = JSON.stringify({ c:name, e:mode, d:addr, n:notes, env:ship, items:cart.map(i => [i.num, i.size, i.tipo === "bote_nuevo" ? "B" : "R", i.qty, i.unitPrice]) });
  const msg = "✨ *NUEVO PEDIDO - EL ORIGEN DEL PERFUME* ✨\n\n👤 *Cliente:* " + name + "\n📦 *Entrega:* " + mode + (addr ? "\n📍 *Dirección:* " + addr : "") + (notes ? "\n📝 *Notas:* " + notes : "") + "\n\n*Detalle del pedido:*\n" + lines + (ship > 0 ? "\n🚚 *Envío:* " + ship.toFixed(2) + "€" : (mode === "sesena" ? "\n🚚 *Envío Seseña:* GRATIS" : "")) + "\n💰 *TOTAL:* " + total.toFixed(2) + "€\n\n---TPV---\n" + payloadObj;
  window.open("https://wa.me/" + APP_DATA.whatsapp + "?text=" + encodeURIComponent(msg), "_blank");
}
document.querySelectorAll("#catTabs .tab").forEach(btn => btn.addEventListener("click", () => { document.querySelectorAll("#catTabs .tab").forEach(b => b.classList.remove("active")); btn.classList.add("active"); currentCat = btn.dataset.cat; renderProducts(); }));
document.getElementById("searchInput").addEventListener("input", renderProducts);
renderBanner(); renderProducts(); updateBar();
</script>
</body>
