<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>El Origen del Perfume | Catálogo y Pedidos</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #181b22;
    --card-2: #20242e;
    --gold: #d4af37;
    --gold-soft: rgba(212, 175, 55, 0.14);
    --text: #f3f4f6;
    --muted: #9ca3af;
    --border: #2b303c;
    --green: #22c55e;
    --red: #ef4444;
    --blue: #3b82f6;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); padding-bottom: 95px;
  }
  header {
    background: linear-gradient(135deg, #161922 0%, #0d0f14 100%);
    border-bottom: 1px solid var(--border);
    padding: 16px 14px 12px;
    position: sticky; top: 0; z-index: 30;
  }
  .brand { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .brand h1 { margin: 0; font-size: 1.18rem; color: var(--gold); letter-spacing: 0.4px; }
  .brand small { display: block; color: var(--muted); font-size: 0.76rem; margin-top: 2px; }
  .badge-zone {
    background: var(--gold-soft); color: var(--gold); border: 1px solid rgba(212,175,55,0.35);
    padding: 4px 9px; border-radius: 999px; font-size: 0.72rem; font-weight: 600; white-space: nowrap;
  }
  .search-wrap { margin-top: 10px; display: flex; gap: 8px; }
  .search-wrap input {
    flex: 1; background: var(--card-2); border: 1px solid var(--border); color: var(--text);
    padding: 10px 12px; border-radius: 10px; font-size: 0.95rem; outline: none;
  }
  .search-wrap input:focus { border-color: var(--gold); }
  .tabs {
    display: flex; gap: 6px; overflow-x: auto; padding: 10px 14px 4px; scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    background: var(--card); border: 1px solid var(--border); color: var(--muted);
    padding: 7px 13px; border-radius: 999px; font-size: 0.82rem; font-weight: 600;
    white-space: nowrap; cursor: pointer;
  }
  .tab.active { background: var(--gold); color: #111; border-color: var(--gold); }
  .price-banner {
    margin: 8px 14px; padding: 10px 12px; background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; font-size: 0.78rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between;
  }
  .price-banner strong { color: var(--text); }
  .list { padding: 6px 14px; display: grid; gap: 10px; }
  .item {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .item.soldout { opacity: 0.55; }
  .item-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .ref-pill {
    background: var(--card-2); color: var(--gold); font-weight: 700; font-size: 0.78rem;
    padding: 3px 8px; border-radius: 7px; border: 1px solid var(--border);
  }
  .item-title { font-weight: 700; font-size: 0.98rem; margin: 2px 0; }
  .item-sub { font-size: 0.78rem; color: var(--muted); }
  .tag-new {
    background: rgba(34,197,94,0.16); color: #4ade80; border: 1px solid rgba(34,197,94,0.35);
    font-size: 0.68rem; font-weight: 700; padding: 2px 7px; border-radius: 999px; margin-left: 6px;
  }
  .tag-out {
    background: rgba(239,68,68,0.16); color: #f87171; border: 1px solid rgba(239,68,68,0.35);
    font-size: 0.68rem; font-weight: 700; padding: 2px 7px; border-radius: 999px; margin-left: 6px;
  }
  .controls { display: grid; grid-template-columns: 1fr 1fr auto; gap: 6px; align-items: center; }
  select, .btn-add {
    height: 38px; border-radius: 9px; font-size: 0.82rem; font-weight: 600;
  }
  select {
    background: var(--card-2); color: var(--text); border: 1px solid var(--border); padding: 0 8px; outline: none;
  }
  .btn-add {
    background: var(--gold); color: #111; border: none; padding: 0 14px; cursor: pointer; font-weight: 700;
  }
  .btn-add:disabled { background: #374151; color: #9ca3af; cursor: not-allowed; }
  .cart-bar {
    position: fixed; bottom: 0; left: 0; right: 0; background: #14171f;
    border-top: 1px solid var(--gold); padding: 12px 14px; z-index: 40;
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
  }
  .cart-bar-info strong { display: block; font-size: 1rem; color: var(--gold); }
  .cart-bar-info span { font-size: 0.78rem; color: var(--muted); }
  .btn-open-cart {
    background: var(--green); color: #052e16; border: none; border-radius: 11px;
    padding: 11px 16px; font-weight: 800; font-size: 0.9rem; cursor: pointer;
  }
  .modal {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.82); z-index: 50;
    overflow-y: auto; padding: 16px;
  }
  .modal.open { display: block; }
  .modal-box {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    max-width: 520px; margin: 10px auto 40px; padding: 16px;
  }
  .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .modal-head h2 { margin: 0; font-size: 1.1rem; color: var(--gold); }
  .close-btn { background: none; border: none; color: var(--muted); font-size: 1.4rem; cursor: pointer; }
  .cart-line {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 0.86rem;
  }
  .qty-box { display: flex; align-items: center; gap: 6px; }
  .qty-btn {
    width: 26px; height: 26px; border-radius: 7px; border: 1px solid var(--border);
    background: var(--card-2); color: var(--text); font-weight: 700; cursor: pointer;
  }
  .field { margin-top: 10px; }
  .field label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 4px; }
  .field input, .field select, .field textarea {
    width: 100%; background: var(--card-2); border: 1px solid var(--border); color: var(--text);
    padding: 9px 10px; border-radius: 9px; font-size: 0.9rem;
  }
  .alert-box {
    margin-top: 10px; padding: 10px; border-radius: 10px; font-size: 0.82rem; line-height: 1.35;
  }
  .alert-warn { background: rgba(245,158,11,0.14); border: 1px solid rgba(245,158,11,0.4); color: #fcd34d; }
  .alert-err { background: rgba(239,68,68,0.14); border: 1px solid rgba(239,68,68,0.4); color: #fca5a5; }
  .alert-ok { background: rgba(34,197,94,0.14); border: 1px solid rgba(34,197,94,0.4); color: #86efac; }
  .btn-wa {
    width: 100%; margin-top: 14px; background: #25D366; color: #052e16; border: none;
    padding: 13px; border-radius: 12px; font-size: 0.98rem; font-weight: 800; cursor: pointer;
  }
  .btn-wa:disabled { background: #374151; color: #9ca3af; cursor: not-allowed; }
  .btn-sec {
    background: var(--card-2); color: var(--text); border: 1px solid var(--border);
    padding: 7px 11px; border-radius: 8px; font-size: 0.8rem; cursor: pointer; margin-top: 6px;
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div>
      <h1>El Origen del Perfume</h1>
      <small>Equivalencias de alta duración · Seseña y Envíos</small>
    </div>
    <span class="badge-zone">📍 El Quiñón / Seseña</span>
  </div>
  <div class="search-wrap">
    <input type="search" id="searchInput" placeholder="Buscar nº ref, perfume o marca (ej: Sauvage, 40, Baccarat)...">
  </div>
</header>

<div class="tabs" id="catTabs">
  <button class="tab active" data-cat="Todos">Todos</button>
  <button class="tab" data-cat="Novedades">✨ Novedades</button>
  <button class="tab" data-cat="Masculina">Masculina</button>
  <button class="tab" data-cat="Femenina">Femenina</button>
  <button class="tab" data-cat="Nicho">Nicho / Autor</button>
</div>

<div class="price-banner" id="priceBanner"></div>

<main class="list" id="productList"></main>

<div class="cart-bar">
  <div class="cart-bar-info">
    <strong id="barTotal">0,00 € (0 uds)</strong>
    <span id="barSub">Envío gratis en Seseña desde 25€</span>
  </div>
  <button class="btn-open-cart" onclick="openCart()">Ver Pedido 🛒</button>
</div>

<div class="modal" id="cartModal">
  <div class="modal-box">
    <div class="modal-head">
      <h2>Tu Pedido</h2>
      <button class="close-btn" onclick="closeCart()">✕</button>
    </div>
    <div id="cartItems"></div>

    <div class="field">
      <label>Modalidad de entrega *</label>
      <select id="deliveryMode" onchange="updateCartUI()">
        <option value="quinon">🏠 Recogida y prueba en El Quiñón (Gratis)</option>
        <option value="sesena">🚗 Reparto a domicilio en Seseña (Gratis ≥ 25€)</option>
        <option value="nacional">📦 Envío Nacional por Correos / Mensajería</option>
      </select>
    </div>

    <div id="deliveryAlert"></div>

    <div class="field">
      <label>Tu Nombre *</label>
      <input type="text" id="custName" placeholder="Ej: Laura García">
    </div>
    <div class="field" id="addressWrap" style="display:none;">
      <label>Dirección / Zona de entrega *</label>
      <input type="text" id="custAddress" placeholder="Calle, portal, piso o localidad">
    </div>
    <div class="field">
      <label>Notas (opcional)</label>
      <input type="text" id="custNotes" placeholder="Ej: Prefiero recoger por la tarde / Bizum">
    </div>

    <div style="margin-top:12px; display:flex; justify-content:space-between; font-size:1.05rem; font-weight:800;">
      <span>Total estimado:</span>
      <span id="modalTotal" style="color:var(--gold);">0,00 €</span>
    </div>

    <button class="btn-wa" id="btnSendWA" onclick="sendWhatsApp()">📲 Enviar Pedido por WhatsApp</button>
  </div>
</div>

}/*APP_DATA_END*/;

let currentCat = "Todos";
let cart = [];

function getPrice(perfume, tipo, size) {
  if (perfume.precios && perfume.precios[tipo] && perfume.precios[tipo][size] != null) {
    return Number(perfume.precios[tipo][size]);
  }
  const tier = perfume.cat === "Nicho" ? "Nicho" : "Comercial";
  return Number(APP_DATA.precios[tier][tipo][size]);
}

function renderBanner() {
  const c = APP_DATA.precios.Comercial;
  const n = APP_DATA.precios.Nicho;
  document.getElementById("priceBanner").innerHTML = `
    <div><strong>Comercial:</strong> 30ml ${c.bote_nuevo["30"]}€ · 50ml ${c.bote_nuevo["50"]}€ · 100ml ${c.bote_nuevo["100"]}€</div>
    <div><strong>Nicho:</strong> 30ml ${n.bote_nuevo["30"]}€ · 50ml ${n.bote_nuevo["50"]}€ · 100ml ${n.bote_nuevo["100"]}€</div>
    <div><strong>♻️ Recarga (Solo Seseña):</strong> -2€ sobre precio frasco</div>
  `;
}

function renderProducts() {
  const q = document.getElementById("searchInput").value.trim().toLowerCase();
  const list = document.getElementById("productList");
  const filtered = APP_DATA.perfumes.filter(p => {
    if (p.oculto) return false;
    if (currentCat === "Novedades" && !p.novedad) return false;
    if (currentCat !== "Todos" && currentCat !== "Novedades" && p.cat !== currentCat) return false;
    if (!q) return true;
    return p.num.toLowerCase().includes(q) || p.nombre.toLowerCase().includes(q) || p.marca.toLowerCase().includes(q);
  });

  if (!filtered.length) {
    list.innerHTML = `<div class="item" style="text-align:center;color:var(--muted);">No se encontraron referencias con "${q}".</div>`;
    return;
  }

  list.innerHTML = filtered.map(p => {
    const out = p.agotado === true;
    return `
      <div class="item ${out ? 'soldout' : ''}">
        <div class="item-top">
          <div>
            <span class="ref-pill">Ref. #${p.num}</span>
            ${p.novedad ? '<span class="tag-new">NOVEDAD</span>' : ''}
            ${out ? '<span class="tag-out">AGOTADO</span>' : ''}
            <div class="item-title">${p.nombre}</div>
            <div class="item-sub">Inspirado en ${p.marca} · Línea ${p.cat}</div>
          </div>
        </div>
        <div class="controls">
          <select id="type_${p.num}" onchange="updateItemBtn('${p.num}')" ${out ? 'disabled' : ''}>
            <option value="bote_nuevo">🧴 Frasco Nuevo</option>
            <option value="relleno">♻️ Recarga (Seseña)</option>
          </select>
          <select id="size_${p.num}" onchange="updateItemBtn('${p.num}')" ${out ? 'disabled' : ''}>
            <option value="30">30 ml (${getPrice(p,'bote_nuevo','30')}€)</option>
            <option value="50" selected>50 ml (${getPrice(p,'bote_nuevo','50')}€)</option>
            <option value="100">100 ml (${getPrice(p,'bote_nuevo','100')}€)</option>
          </select>
          <button class="btn-add" id="btn_${p.num}" onclick="addToCart('${p.num}')" ${out ? 'disabled' : ''}>
            ${out ? 'Agotado' : '+ ' + getPrice(p,'bote_nuevo','50') + '€'}
          </button>
        </div>
      </div>
    `;
  }).join("");
}

function updateItemBtn(num) {
  const p = APP_DATA.perfumes.find(x => x.num === num);
  const tipo = document.getElementById("type_" + num).value;
  const sizeSel = document.getElementById("size_" + num);
  const currentSize = sizeSel.value;
  ["30", "50", "100"].forEach((sz, idx) => {
    sizeSel.options[idx].text = `${sz} ml (${getPrice(p, tipo, sz)}€)`;
  });
  const price = getPrice(p, tipo, currentSize);
  document.getElementById("btn_" + num).textContent = `+ ${price}€`;
}

function addToCart(num) {
  const p = APP_DATA.perfumes.find(x => x.num === num);
  const tipo = document.getElementById("type_" + num).value;
  const size = document.getElementById("size_" + num).value;
  const unitPrice = getPrice(p, tipo, size);

  const existing = cart.find(i => i.num === num && i.tipo === tipo && i.size === size);
  if (existing) {
    existing.qty += 1;
  } else {
    cart.push({ num: p.num, nombre: p.nombre, marca: p.marca, cat: p.cat, tipo, size, unitPrice, qty: 1 });
  }
  updateBar();
}

function updateBar() {
  const qty = cart.reduce((s, i) => s + i.qty, 0);
  const sub = cart.reduce((s, i) => s + i.qty * i.unitPrice, 0);
  document.getElementById("barTotal").textContent = `${sub.toFixed(2).replace('.', ',')} € (${qty} ${qty === 1 ? 'ud' : 'uds'})`;
  const diff = APP_DATA.envioGratisSesena - sub;
  document.getElementById("barSub").textContent = sub === 0
    ? `Envío gratis en Seseña desde ${APP_DATA.envioGratisSesena}€`
    : (diff > 0 ? `Te faltan ${diff.toFixed(2).replace('.', ',')}€ para envío gratis en Seseña` : `✅ ¡Tienes envío gratis en Seseña!`);
}

function openCart() {
  document.getElementById("cartModal").classList.add("open");
  updateCartUI();
}
function closeCart() {
  document.getElementById("cartModal").classList.remove("open");
}

function changeQty(idx, delta) {
  cart[idx].qty += delta;
  if (cart[idx].qty <= 0) cart.splice(idx, 1);
  updateBar();
  updateCartUI();
}

function convertRefillsToBottles() {
  cart.forEach(item => {
    if (item.tipo === "relleno") {
      const p = APP_DATA.perfumes.find(x => x.num === item.num);
      item.tipo = "bote_nuevo";
      item.unitPrice = getPrice(p, "bote_nuevo", item.size);
    }
  });
  updateBar();
  updateCartUI();
}

function updateCartUI() {
  const box = document.getElementById("cartItems");
  const mode = document.getElementById("deliveryMode").value;
  document.getElementById("addressWrap").style.display = mode === "quinon" ? "none" : "block";

  if (!cart.length) {
    box.innerHTML = `<p style="color:var(--muted);font-size:0.9rem;">Tu cesta está vacía. Añade algún perfume del catálogo.</p>`;
    document.getElementById("deliveryAlert").innerHTML = "";
    document.getElementById("modalTotal").textContent = "0,00 €";
    document.getElementById("btnSendWA").disabled = true;
    return;
  }

  box.innerHTML = cart.map((item, idx) => `
    <div class="cart-line">
      <div>
        <strong>#${item.num} ${item.nombre}</strong><br>
        <span style="color:var(--muted);font-size:0.78rem;">
          ${item.tipo === 'bote_nuevo' ? '🧴 Frasco Nuevo' : '♻️ Recarga'} · ${item.size}ml · ${item.unitPrice}€/ud
        </span>
      </div>
      <div class="qty-box">
        <button class="qty-btn" onclick="changeQty(${idx}, -1)">-</button>
        <span>${item.qty}</span>
        <button class="qty-btn" onclick="changeQty(${idx}, 1)">+</button>
      </div>
    </div>
  `).join("");

  const sub = cart.reduce((s, i) => s + i.qty * i.unitPrice, 0);
  const hasRefill = cart.some(i => i.tipo === "relleno");
  let shipping = 0;
  let alertHtml = "";
  let blocked = false;

  if (mode === "quinon") {
    alertHtml = `<div class="alert-box alert-ok">🏠 Recogida y prueba gratuita en El Quiñón (Seseña). Te confirmamos hora por WhatsApp.</div>`;
  } else if (mode === "sesena") {
    if (sub >= APP_DATA.envioGratisSesena) {
      alertHtml = `<div class="alert-box alert-ok">🚗 ¡Envío a domicilio en Seseña GRATIS por superar los ${APP_DATA.envioGratisSesena}€!</div>`;
    } else {
      shipping = Number(APP_DATA.costeEnvioSesena || 0);
      alertHtml = `<div class="alert-box alert-warn">🚗 Pedido inferior a ${APP_DATA.envioGratisSesena}€. Se añade suplemento de reparto en Seseña (+${shipping.toFixed(2).replace('.', ',')}€) o puedes recoger gratis en El Quiñón.</div>`;
    }
  } else if (mode === "nacional") {
    if (hasRefill) {
      blocked = true;
      alertHtml = `
        <div class="alert-box alert-err">
          ⚠️ Las <strong>recargas</strong> solo están disponibles en Seseña (necesitamos tu frasco). Para envío nacional debes pedir <strong>Frasco Nuevo</strong>.
          <br><button class="btn-sec" onclick="convertRefillsToBottles()">🔄 Cambiar recargas a Frasco Nuevo</button>
        </div>`;
    } else {
      shipping = Number(APP_DATA.costeEnvioNacional || 0);
      alertHtml = `<div class="alert-box alert-warn">📦 Envío Nacional (+${shipping.toFixed(2).replace('.', ',')}€ estimado). Pago previo por Bizum antes del envío.</div>`;
    }
  }

  document.getElementById("deliveryAlert").innerHTML = alertHtml;
  const total = sub + shipping;
  document.getElementById("modalTotal").textContent = `${total.toFixed(2).replace('.', ',')} €`;
  document.getElementById("btnSendWA").disabled = blocked;
}

function sendWhatsApp() {
  const name = document.getElementById("custName").value.trim();
  const mode = document.getElementById("deliveryMode").value;
  const addr = document.getElementById("custAddress").value.trim();
  const notes = document.getElementById("custNotes").value.trim();

  if (!name) { alert("Por favor, escribe tu nombre."); return; }
  if (mode !== "quinon" && !addr) { alert("Por favor, indica tu dirección o localidad de entrega."); return; }

  const modeLabels = {
    quinon: "Recogida en El Quiñón (Seseña)",
    sesena: "Reparto domicilio Seseña",
    nacional: "Envío Nacional"
  };

  const sub = cart.reduce((s, i) => s + i.qty * i.unitPrice, 0);
  let shipping = 0;
  if (mode === "sesena" && sub < APP_DATA.envioGratisSesena) shipping = Number(APP_DATA.costeEnvioSesena || 0);
  if (mode === "nacional") shipping = Number(APP_DATA.costeEnvioNacional || 0);
  const total = sub + shipping;

  const lines = cart.map(i =>
    `• Ref #${i.num} ${i.nombre} (${i.size}ml · ${i.tipo === 'bote_nuevo' ? 'Frasco' : 'Recarga'}) x${i.qty} = ${(i.qty * i.unitPrice).toFixed(2)}€`
  ).join("\n");

  // Código compacto para importar en 1 clic en el TPV móvil
  const sysPayload = JSON.stringify({
    c: name,
    e: mode,
    d: addr,
    n: notes,
    env: shipping,
    items: cart.map(i => [i.num, i.size, i.tipo === 'bote_nuevo' ? 'B' : 'R', i.qty, i.unitPrice])
  });

  const msg = `✨ *NUEVO PEDIDO - EL ORIGEN DEL PERFUME* ✨\n\n` +
    `👤 *Cliente:* ${name}\n` +
    `🚚 *Entrega:* ${modeLabels[mode]}\n` +
    (addr ? `📍 *Dirección:* ${addr}\n` : "") +
    (notes ? `📝 *Notas:* ${notes}\n` : "") +
    `\n*Detalle del pedido:*\n${lines}\n\n` +
    (shipping > 0 ? `🚚 *Envío:* ${shipping.toFixed(2)}€\n` : "") +
    `💰 *TOTAL:* ${total.toFixed(2)}€\n\n` +
    `---TPV---\n${sysPayload}`;

  const url = `https://wa.me/${APP_DATA.whatsapp}?text=${encodeURIComponent(msg)}`;
  window.open(url, "_blank");
}

document.querySelectorAll(".tab").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentCat = btn.dataset.cat;
    renderProducts();
  });
});
document.getElementById("searchInput").addEventListener("input", renderProducts);

renderBanner();
renderProducts();
updateBar();
</script>
</body>
</html>
